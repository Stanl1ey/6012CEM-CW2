<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="ShoeZone — find the pair that moves you." />
    <title>ShoeZone</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (window.location.protocol === 'file:') {
        document.getElementById('root').innerHTML = `
          <main style="box-sizing:border-box;max-width:560px;margin:10vh auto;padding:36px 30px;border-radius:24px;background:#fff;color:#1c2933;font:16px/1.55 Segoe UI,Arial,sans-serif;box-shadow:0 20px 60px #24384c20">
            <div style="color:#5d9fdf;font-size:12px;font-weight:700;letter-spacing:.12em">SHOEZONE</div>
            <h1 style="margin:12px 0 8px;font-size:28px">Start the app with Vite</h1>
            <p style="color:#687782">This React project cannot run by opening <code>index.html</code> directly. Start the local development server instead.</p>
            <ol style="padding-left:22px">
              <li>Open the project folder.</li>
              <li>Double-click <code>start-shoezone.bat</code>.</li>
              <li>Keep the terminal window open while you use the app.</li>
            </ol>
            <p style="margin-bottom:0;color:#87939b;font-size:13px">If the launcher says Node.js or npm is missing, install Node.js LTS and then run the launcher again.</p>
          </main>`;
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
